[project]
name = "insider-case-builder"
version = "0.1.0"
description = "Vendor-neutral insider-threat case builder: deterministic detectors, a stdio MCP server, and a Claude Code skill."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# The engine is standard library only. mcp is the single runtime dependency
# (needed to speak the Model Context Protocol over stdio).
dependencies = ["mcp==2.3.0"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insider_case"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
