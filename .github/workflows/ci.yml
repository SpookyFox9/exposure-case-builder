name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can only read the repository. It uses no secrets.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      # Actions are pinned to full commit hashes, not movable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the locked dependencies
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Run every quality gate
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: sh scripts/check_all.sh
